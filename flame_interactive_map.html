:root{--red:#c42418;--orange:#f04b23;--ink:#26313b;--muted:#6c7782;--bg:#eef2f5;--card:#fff;}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:18px 24px 10px;padding:16px 20px;background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 8px 30px rgba(34,49,63,.08);z-index:5}
.brand{display:flex;align-items:center;gap:15px}.brand-mark{width:42px;height:56px;border-radius:6px;background:linear-gradient(180deg,#fff,#f9f9f9);border:1px solid #eee;display:grid;place-items:center;color:var(--orange);font-weight:900;font-size:12px}.brand h1{font-size:22px;line-height:1;margin:0;color:#b51d15;letter-spacing:.02em}.brand p{margin:8px 0 0;font-size:11px;letter-spacing:.23em;color:#5f6973;font-weight:700}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar button,.toolbar input{border:1px solid #d8dfe5;background:#fff;border-radius:10px;height:38px}.toolbar button{min-width:38px;padding:0 12px;cursor:pointer;font-weight:700;color:#3e4852}.toolbar button:hover{background:#f8fafb}.toolbar input{padding:0 12px;width:190px;outline:none}.toolbar .accent{background:var(--red);color:#fff;border-color:var(--red)}
.main{min-height:0;position:relative;padding:0 24px 24px}.viewport{height:100%;border-radius:20px;overflow:hidden;background:#f4f7f9;position:relative;box-shadow:inset 0 0 0 1px rgba(31,48,61,.06);cursor:grab;touch-action:none}.viewport.dragging{cursor:grabbing}.stage{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;will-change:transform}.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border:0;border-radius:50%;background:rgba(240,75,35,.95);box-shadow:0 0 0 5px rgba(240,75,35,.22),0 3px 10px rgba(0,0,0,.25);cursor:pointer;z-index:3}.hotspot::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff}.hotspot:hover,.hotspot.active{transform:translate(-50%,-50%) scale(1.25);background:#ba1c13}.label{position:absolute;transform:translate(-50%,11px);background:#fff;color:#aa1b14;border:1px solid #ee7d6a;border-radius:7px;padding:3px 7px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none}
.legend{position:absolute;left:42px;bottom:40px;background:rgba(255,255,255,.92);border-radius:12px;padding:10px 12px;display:flex;gap:16px;align-items:center;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.08);backdrop-filter:blur(6px);z-index:4}.legend span{display:flex;align-items:center;gap:7px}.swatch{width:13px;height:13px;border-radius:3px;background:#bcc2c8}.swatch.flame{background:var(--orange)}
.card{position:absolute;right:42px;top:26px;width:min(330px,calc(100% - 84px));background:rgba(255,255,255,.97);border-radius:16px;padding:18px;box-shadow:0 16px 44px rgba(22,35,46,.16);z-index:6;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.22s ease}.card.show{transform:translateY(0);opacity:1;pointer-events:auto}.card h2{margin:0 30px 8px 0;color:#b51d15;font-size:22px}.card p{margin:5px 0;color:#63707a;line-height:1.45}.card .meta{margin-top:12px;padding-top:12px;border-top:1px solid #edf0f2;font-size:13px}.close{position:absolute;right:12px;top:12px;border:0;background:#f1f3f5;border-radius:9px;width:30px;height:30px;cursor:pointer;font-weight:900}.country-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{border:1px solid #e2e6ea;background:#fff;padding:5px 8px;border-radius:999px;font-size:12px;cursor:pointer}.chip:hover{border-color:#e67462;color:#b51d15}
.hint{position:absolute;right:42px;bottom:40px;background:rgba(32,43,52,.84);color:#fff;padding:9px 12px;border-radius:10px;font-size:12px;z-index:4;backdrop-filter:blur(4px)}
@media(max-width:850px){header{margin:10px 10px 8px;padding:12px}.brand h1{font-size:16px}.brand p{display:none}.toolbar input{width:125px}.main{padding:0 10px 10px}.card{right:20px;top:20px}.legend{left:20px;bottom:20px}.hint{display:none}}
</style>

<script>
const countries=[
 {name:'Ghana',x:48.2,y:51.9,region:'West Africa'},
 {name:'Togo',x:50.2,y:49.8,region:'West Africa'},
 {name:'Benin',x:52.2,y:51.0,region:'West Africa'},
 {name:'Chad',x:55.0,y:47.4,region:'Central Africa'},
 {name:'Gabon',x:53.6,y:57.3,region:'Central Africa'},
 {name:'Burundi',x:59.0,y:56.2,region:'East Africa'},
 {name:'Madagascar',x:62.4,y:64.8,region:'Indian Ocean / East Africa'},
 {name:'Bangladesh',x:74.0,y:42.6,region:'South Asia'},
 {name:'Vietnam',x:79.8,y:46.3,region:'Southeast Asia'},
 {name:'Cambodia',x:77.5,y:49.7,region:'Southeast Asia'},
 {name:'Indonesia',x:82.4,y:57.7,region:'Southeast Asia'}
];
const hotspots=document.getElementById('hotspots'),card=document.getElementById('card'),title=document.getElementById('cardTitle'),textEl=document.getElementById('cardText'),meta=document.getElementById('cardMeta'),list=document.getElementById('countryList');
function openCountry(c){document.querySelectorAll('.hotspot').forEach(h=>h.classList.toggle('active',h.dataset.name===c.name));title.textContent=c.name;textEl.textContent='Mission footprint shown on the FLAME worldwide service map.';meta.innerHTML='<strong>Region:</strong> '+c.region+'<br><strong>Map status:</strong> FLAME-highlighted mission country';card.classList.add('show');}
countries.forEach(c=>{let b=document.createElement('button');b.className='hotspot';b.dataset.name=c.name;b.style.left=c.x+'%';b.style.top=c.y+'%';b.title=c.name;b.setAttribute('aria-label',c.name);b.onclick=e=>{e.stopPropagation();openCountry(c)};let l=document.createElement('span');l.className='label';l.style.left=c.x+'%';l.style.top=c.y+'%';l.textContent=c.name;hotspots.append(b,l);let chip=document.createElement('button');chip.className='chip';chip.textContent=c.name;chip.onclick=()=>{openCountry(c);focusCountry(c)};list.appendChild(chip)});
document.getElementById('closeCard').onclick=()=>{card.classList.remove('show');document.querySelectorAll('.hotspot').forEach(h=>h.classList.remove('active'))};
const viewport=document.getElementById('viewport'),stage=document.getElementById('stage');let scale=1,tx=0,ty=0,drag=false,sx=0,sy=0,stx=0,sty=0;
function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function setZoom(ns,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){ns=Math.max(1,Math.min(4,ns));const rect=viewport.getBoundingClientRect();const px=cx-(rect.left||0),py=cy-(rect.top||0);const wx=(px-tx)/scale,wy=(py-ty)/scale;scale=ns;tx=px-wx*scale;ty=py-wy*scale;clamp();apply()}
function clamp(){const w=viewport.clientWidth*scale,h=(viewport.clientWidth*1152/2048)*scale;const minX=Math.min(0,viewport.clientWidth-w),minY=Math.min(0,viewport.clientHeight-h);tx=Math.min(0,Math.max(minX,tx));ty=Math.min(0,Math.max(minY,ty))}
viewport.addEventListener('wheel',e=>{e.preventDefault();setZoom(scale*(e.deltaY<0?1.12:.9),e.clientX,e.clientY)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.hotspot,.card,.legend'))return;drag=true;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!drag)return;tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);clamp();apply()});viewport.addEventListener('pointerup',e=>{drag=false;viewport.classList.remove('dragging')});
document.getElementById('zoomIn').onclick=()=>setZoom(scale*1.25);document.getElementById('zoomOut').onclick=()=>setZoom(scale/1.25);document.getElementById('reset').onclick=()=>{scale=1;tx=ty=0;apply();card.classList.remove('show')};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
function focusCountry(c){const vw=viewport.clientWidth,vh=viewport.clientHeight;scale=Math.max(scale,1.8);tx=vw/2-(c.x/100*vw)*scale;ty=vh/2-(c.y/100*(vw*1152/2048))*scale;clamp();apply()}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const c=countries.find(c=>c.name.toLowerCase().startsWith(q));if(c){openCountry(c);focusCountry(c)}});
window.addEventListener('resize',()=>{clamp();apply()});apply();
</script>
